<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up your site</title>
<style>
body { margin:0; min-height:100vh; display:grid; place-items:center; background:#F5F7F6; color:#12211F;
       font-family:-apple-system, 'Segoe UI', sans-serif; padding:32px; }
.box { max-width:520px; background:#fff; border:1px solid rgba(18,33,31,.1); border-radius:18px; padding:38px; }
h1 { font-size:26px; margin:0 0 12px; }
p { color:#5C6B69; line-height:1.6; }
code { background:#F5F7F6; padding:3px 7px; border-radius:6px; font-size:13.5px; }
a { display:inline-block; margin-top:22px; background:#0F766E; color:#fff; text-decoration:none;
    padding:13px 22px; border-radius:999px; font-weight:600; }
</style>
</head>
<body>
<div class="box">
  <h1>No pages yet</h1>
  <p>The database is running but nothing has been published. Load the demo practice with
     <code>python app.py seed</code>, or sign in and build a page from scratch.</p>
  <a href="/admin">Open the admin panel</a>
</div>
</body>
</html>
